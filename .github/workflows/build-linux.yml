name: Build on Linux
on: 

  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev", "releases/**"  ]
  workflow_dispatch:
    inputs:
      compiler:
        required: false
        type: string
        default: gcc
          
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
        default: gcc

jobs:
    build-linux:
        runs-on: ubuntu-22.04
        
        steps:
        - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

        - name: Install Qt
          uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1 -- note: "v4" is a BRANCH here, not a tag
          with:
            modules: 'qt5compat'
          
        - name: install gcc 10 
          run: sudo apt update && sudo apt install gcc-10
          
        - name: install numpy
          run: pip install numpy
        
        - name: install ffmpeg
          run: sudo apt install ffmpeg
          
        - name: install HDF5
          run: sudo apt install libhdf5-serial-dev

        - name: Build on Linux
          run: |
              mkdir build 
              cd build 
              cmake .. -DCMAKE_BUILD_TYPE=Debug -DNO_WARNINGS=ON -DWITH_PYTHON=ON -DWITH_HDF5=ON -DWITH_FFMPEG=ON -DWITH_LOCAL_FFMPEG=OFF -DLOCAL_INSTALL=ON 
              make -j8 
              cmake --build . --target install
          shell: bash
          env:
           CC:   gcc-10
           CXX:  g++-10

        - name: Run tests
          run: ctest --test-dir build --output-on-failure
          shell: bash

        

